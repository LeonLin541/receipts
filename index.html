<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Receipts</title>
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --ink: #1b1f24; --muted: #66707a; --line: #dde1e6;
    --brand: #1f3a5f; --brand-ink: #fff; --ok: #1e7a46; --warn-bg: #fff4e0; --warn: #8a5300;
    --err-bg: #fde8e8; --err: #a12020;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --card: #1c1f24; --ink: #e8eaed; --muted: #9aa3ad; --line: #2e333a;
      --brand: #6ea0e0; --brand-ink: #0b1420; --ok: #5cc98a; --warn-bg: #3a2c12; --warn: #f0c070;
      --err-bg: #3d1a1a; --err: #ff9a9a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; }
  header { display: flex; align-items: center; gap: 8px; padding: 14px 16px;
    padding-top: max(14px, env(safe-area-inset-top)); background: var(--brand); color: var(--brand-ink); }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  header small { opacity: .8; font-size: 12px; }
  main { padding: 16px; max-width: 560px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  button, .btn { font: inherit; border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer;
    background: var(--line); color: var(--ink); }
  .primary { background: var(--brand); color: var(--brand-ink); font-weight: 600; }
  .big { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
    padding: 26px 16px; font-size: 20px; margin-bottom: 12px; }
  .big input { display: none; }
  .ghost { background: transparent; color: inherit; padding: 6px 10px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=date], input[type=number], input[type=password] {
    width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
  .seg button.on { background: var(--brand); color: var(--brand-ink); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chips button { padding: 6px 12px; font-size: 14px; border-radius: 999px; }
  .blist { list-style: none; padding: 0; margin: 10px 0 14px; }
  .bitem { padding: 8px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
  .bhead { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .bitem.s-filed .bhead, .bitem.s-reading .bhead, .bitem.s-filing .bhead { cursor: default; opacity: .75; }
  .bitem.open { border-color: var(--brand); }
  .bitem #review-card { margin: 10px 0 2px; padding: 12px; }
  .bitem.s-check { border-color: var(--warn); background: var(--warn-bg); }
  .bitem.s-error { border-color: var(--err); background: var(--err-bg); }
  .thumb { width: 44px; height: 56px; flex: none; border-radius: 6px; overflow: hidden; background: var(--bg);
    display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .btext { flex: 1; min-width: 0; }
  .bname { font-size: 13px; word-break: break-word; }
  .bsub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .bitem.s-check .bsub { color: var(--warn); }
  .bitem.s-error .bsub { color: var(--err); }
  .bitem.s-filed .bsub { color: var(--ok); }
  .bx { flex: none; font-size: 16px; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--ink); font-size: 15px; }
  .check input { width: 20px; height: 20px; }
  #preview { max-height: 240px; overflow: hidden; border-radius: 10px; margin-bottom: 8px; text-align: center; color: var(--muted); }
  #preview img { width: 100%; object-fit: contain; max-height: 240px; }
  .warn { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; margin-top: 10px; font-size: 14px; }
  #plan { white-space: pre-wrap; word-break: break-word; font-size: 14px; background: var(--bg);
    border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
  .actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 14px; }
  button:disabled { opacity: .45; cursor: default; }
  .spinner { width: 42px; height: 42px; border: 4px solid var(--line); border-top-color: var(--brand);
    border-radius: 50%; animation: spin 1s linear infinite; margin: 30px auto 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .center { text-align: center; }
  .ok { color: var(--ok); font-size: 40px; }
  #history { padding-left: 18px; margin: 6px 0 0; font-size: 13px; color: var(--muted); }
  #history li { margin-bottom: 4px; word-break: break-word; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom));
    background: var(--ink); color: var(--bg); padding: 12px 14px; border-radius: 12px; font-size: 14px; }
  .toast.error { background: var(--err-bg); color: var(--err); border: 1px solid var(--err); }
  pre { white-space: pre-wrap; font-size: 13px; color: var(--muted); margin: 6px 0 0; }
  h2 { font-size: 16px; margin: 0 0 6px; }
  .muted { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>收据归档 <small id="who"></small></h1>
  <button id="signin" class="ghost" hidden>登录</button>
  <button id="open-settings" class="ghost" aria-label="设置">⚙︎</button>
</header>

<main>
  <section id="home">
    <label class="btn primary big">📷 拍收据<input id="cam" type="file" accept="image/*" capture="environment"></label>
    <label class="btn big">📄 选文件（可多选，照片 / PDF）<input id="pick" type="file" multiple accept="image/*,application/pdf"></label>
    <div id="history-wrap" class="card" hidden>
      <h2>最近归档</h2>
      <ul id="history"></ul>
    </div>
  </section>

  <section id="busy" hidden>
    <div class="spinner"></div>
    <p class="center" id="busy-text">处理中…</p>
  </section>

  <section id="review" hidden>
    <div class="card" id="review-card">
      <div id="preview"></div>
      <div id="notes" class="warn" hidden></div>

      <label>公司</label>
      <div class="seg">
        <button type="button" data-company="JML">JML</button>
        <button type="button" data-company="PU">Prop United</button>
      </div>
      <div id="card-warn" class="warn" hidden></div>

      <div class="row">
        <div><label for="f-date">日期</label><input id="f-date" type="date"></div>
        <div><label for="f-card">卡号后 4 位</label><input id="f-card" type="text" inputmode="numeric" maxlength="4"></div>
      </div>
      <label for="f-merchant">商家</label><input id="f-merchant" type="text">
      <label for="f-purpose">用途</label><input id="f-purpose" type="text">
      <div class="chips">
        <button type="button" data-purpose="Lunch">Lunch</button>
        <button type="button" data-purpose="Working Lunch">Working Lunch</button>
        <button type="button" data-purpose="Working Dinner">Working Dinner</button>
      </div>
      <label for="f-property">物业（可空）</label><input id="f-property" type="text" placeholder="76CHL / 19FG / R4-37CR">
      <div class="row">
        <div><label for="f-total">总额 £</label><input id="f-total" type="number" step="0.01" inputmode="decimal"></div>
        <div><label for="f-vat">VAT £</label><input id="f-vat" type="number" step="0.01" inputmode="decimal"></div>
      </div>
      <label for="f-vatno">供应商 VAT 号</label><input id="f-vatno" type="text">
      <label class="check"><input id="f-isvat" type="checkbox"> VAT receipt（可抵扣）</label>

      <div id="plan"></div>
      <div id="dup-warn" class="warn" hidden>登记表里已有同一天、同金额的收据 —— 可能重复了。</div>

      <div class="actions">
        <button id="cancel" type="button">取消</button>
        <button id="confirm" type="button" class="primary">确认归档</button>
      </div>
    </div>
  </section>

  <section id="batch" hidden>
    <div class="card">
      <h2 id="batch-title">批量处理</h2>
      <p class="muted">点开每一张核对，按「确认」只是标记好，不会马上归档；全部确认完，最后按一次「一键归档」。</p>
      <ul id="batch-list" class="blist"></ul>
      <button id="batch-file" type="button" class="primary big">归档</button>
      <div class="actions">
        <label class="btn center">＋ 加图片<input id="batch-add" type="file" multiple accept="image/*,application/pdf" hidden></label>
        <button id="batch-close" type="button">完成</button>
      </div>
    </div>
  </section>

  <section id="done" hidden>
    <div class="card center">
      <div class="ok">✓</div>
      <p><strong id="done-name"></strong></p>
      <p class="muted" id="done-folder"></p>
      <button id="again" class="primary big">📷 再拍一张</button>
    </div>
  </section>

  <section id="settings" hidden>
    <div class="card">
      <h2>设置</h2>
      <label>JML 账号</label>
      <div id="s-account" class="muted"></div>
      <label>Prop United 账号（存 Prop United 收据用）</label>
      <div id="s-pu" class="muted"></div>
      <button id="s-pu-signin" type="button" hidden>登录 Prop United</button>
      <label for="s-key">Claude API key（只存在这台手机上）</label>
      <input id="s-key" type="password" autocomplete="off" placeholder="sk-ant-…">
      <label>已登记的卡（来自 OneDrive 设置文件）</label>
      <pre id="s-cards"></pre>
      <div class="actions">
        <button id="close-settings" type="button">返回</button>
        <button id="s-save" type="button" class="primary">保存</button>
      </div>
      <div class="actions">
        <button id="s-reload" type="button">刷新卡号/目录设置</button>
        <button id="s-signout" type="button">退出登录</button>
      </div>
    </div>
  </section>
</main>

<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@5.25.0/lib/msal-browser.min.js"></script>
<script type="module" src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
